<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#302b63"/>
      <stop offset="1" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0072ff"/><stop offset="1" stop-color="#00c6ff"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="280" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <!-- liquid waves -->
    <path fill="url(#w1)" opacity="0.30" d="M0 215 Q150 175 300 215 T600 215 T900 215 T1200 215 T1500 215 T1800 215 V280 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#w1)" opacity="0.45" d="M0 232 Q150 200 300 232 T600 232 T900 232 T1200 232 T1500 232 T1800 232 V280 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#w1)" opacity="0.70" d="M0 250 Q150 225 300 250 T600 250 T900 250 T1200 250 T1500 250 T1800 250 V280 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="5s" repeatCount="indefinite"/>
    </path>
    <text x="600" y="108" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#00f2ff">M.R. Tanvir
      <animate attributeName="opacity" from="0" to="1" dur="1.5s" fill="freeze"/>
    </text>
    <text x="600" y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#ffffff">Network Admin  |  Linux SysAdmin  |  SOC Analyst</text>
    <text x="600" y="186" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#9fb4ff">Building reliable and secure infrastructures</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
